<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Extension Options</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body { font-family: "IBM Plex Mono", Menlo, Consolas, monospace, Arial, sans-serif; background: #f9fafb; color: #111827; margin: 0; padding: 1.5em; }
      .settings-box { background: #fff; border: 2px solid #E5E7EB; border-radius: 8px; padding: 1em 2em; max-width: 360px; margin: 1.5em auto; }
      .settings-header { font-size: 1.3em; color: #3B82F6; font-weight: bold; }
      .settings-note { font-size: 0.98em; color: #555; margin-top: .75em;}
    </style>
  </head>
  <body>
    <div class="settings-box">
      <div class="settings-header">Settings / Options</div>
      <div class="settings-note">
        Options/settings functionality coming soon.<br>
        You can add exclusions, settings, and manage index from here.
      </div>
    </div>
  </body>
</html>
